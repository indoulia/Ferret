name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Windows runs here rather than on every pull request — see the matrix below.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded *pull request* run; never cancel one on `main`.
  #
  # Windows moved off the PR gate and onto the push to `main`, which made this
  # setting load-bearing in a way it had not been: two merges in quick
  # succession cancelled the first one's run, and with it the only Windows
  # check that commit would ever get. Observed — `f4e0c39` was cancelled that
  # way, minutes after the arrangement was introduced.
  #
  # A superseded PR run is genuinely redundant, because the next one covers the
  # same branch. A superseded `main` run is not: each commit on `main` is a
  # squash that nothing else verifies on Windows.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # **macOS is measured here for the first time — EPIC-105.**
        #
        # It was deliberately absent, and the reason was correct: "no macOS host
        # was available to validate against… claiming macOS support here without
        # measuring it would be false." Nineteen validation records carried that
        # gap. A hosted macOS runner exists, so the reason has expired, and
        # EPIC-105 §8.1 records that this workflow *is* that Epic's validation
        # environment — there is no local macOS host, which was the premise.
        #
        # It runs on the pull request that introduces it (§8.2), because
        # deciding where it belongs before measuring its cost would be the same
        # guess this Epic exists to end. Windows was moved off the PR gate on
        # measured evidence; macOS gets the same treatment on its own.
        #
        # **Windows does not run on a pull request.** Measured over one working
        # session: Ubuntu verify took 1m52s-2m55s and Windows 6m41s-11m54s, so
        # Windows was the whole of the wait on every one of six PRs.
        #
        # It is *not* dropped, because this repository has real Windows-only
        # history: a digest that failed only there, and a CRLF regression test
        # that failed on the one platform it existed for. Both would have
        # shipped if Windows were merely deleted. So it runs on every push to
        # `main` — after a merge rather than before it — plus nightly and on
        # demand. The signal is kept; what changes is that it no longer blocks
        # the author of every pull request.
        #
        # The trade, stated: a Windows-only break is now found minutes *after*
        # a merge instead of minutes before. On a repository where every merge
        # is a squash onto `main` with a green Ubuntu run behind it, that is a
        # revert rather than an outage.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node: ['22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Database suites are deliberately skipped here and owned by the
      # `storage` job below, which pins a PostgreSQL service container.
      # GitHub's Windows *and macOS* runners cannot run Linux containers, so
      # attempting it in this matrix would produce coverage on Linux and a
      # silent skip on the other two — an asymmetry that is easy to mistake for
      # a passing gate. EPIC-105 §8.3 records the same rule for macOS: a skip is
      # recorded as a skip, never as a pass.
      - name: Test (unit and integration, including packaging)
        run: npm test
        env:
          FERRET_SKIP_DOCKER_POSTGRES: '1'

      - name: Performance baseline
        run: npm run baseline
        env:
          FERRET_SKIP_DOCKER_POSTGRES: '1'

  storage:
    name: storage integration (PostgreSQL 17 + pgvector)
    runs-on: ubuntu-latest

    # The image EPIC-005 benchmarked and validated pgvector 0.8.6 against, so a
    # green run here means green against a server Ferret has actually measured.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ferret_test
          POSTGRES_PASSWORD: ferret_test_password
          POSTGRES_DB: ferret_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Migration, concurrency, crash-recovery, permission and performance
      # suites, all against the real server. EPIC-002's Definition of Done
      # requires this to pass before the Epic can be considered complete.
      - name: Storage integration, durability, reliability and performance
        run: npm test
        env:
          FERRET_TEST_DATABASE_URL: postgres://ferret_test:ferret_test_password@localhost:5432/ferret_test

      - name: Upload measured performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-performance-baseline
          path: docs/Performance/EPIC-002-storage-baseline-*.json
          if-no-files-found: warn

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # High and critical advisories fail the build. Moderate findings are
      # reported but do not block, matching the posture recorded in
      # docs/TECHNOLOGY-DECISIONS.md section 10.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
