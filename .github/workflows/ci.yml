name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is deliberately absent: no macOS host was available to validate
        # against, and EPIC-005 recorded closing that gap as EPIC-105's work.
        # Claiming macOS support here without measuring it would be false.
        os: [ubuntu-latest, windows-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (unit and integration, including packaging)
        run: npm test

      - name: Performance baseline
        run: npm run baseline

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # High and critical advisories fail the build. Moderate findings are
      # reported but do not block, matching the posture recorded in
      # docs/TECHNOLOGY-DECISIONS.md section 10.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
