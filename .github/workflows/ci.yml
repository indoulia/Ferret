name: CI

# Three kinds of coverage, deliberately kept apart — EPIC-114.
#
# **PR correctness.** `verify` and `storage`, on every pull request. They answer
# "is this change correct", against the platform Ferret is developed on and the
# database version it is primarily validated against. Nothing is added to this
# path that does not answer that question, because everything on it is paid for
# by every author on every push.
#
# **Compatibility coverage.** `compatibility`, scheduled. It answers "does the
# range Ferret *claims* to support still work", which is a different question
# with a different cost profile: it is broad, it is slow, and a break in it is
# rarely caused by the commit that revealed it. Running it nightly finds a break
# within a day for zero pull-request wait.
#
# **Platform validation.** The `verify` matrix. Which operating systems are
# measured is an owner decision recorded at that job.
#
# The distinction is the point. A job on the wrong one of these three is either
# slowing every author down or claiming coverage nobody is paying for.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A nightly run on `main`. The reason it was added no longer holds: it existed
  # because Windows ran *only* here and not on pull requests, and the 2026-09-05
  # matrix change put Windows on every event. Kept anyway, for the thing a
  # per-commit run cannot do — a run against a tree nobody touched that day,
  # which is where a time- or environment-dependent break shows up.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel a superseded *pull request* run; never cancel one on `main`.
  #
  # A superseded PR run is genuinely redundant, because the next one covers the
  # same branch. A superseded `main` run is not: each commit on `main` is a
  # squash, and cancelling its run leaves that commit with no verification of
  # its own. Observed — `f4e0c39` was cancelled exactly that way by two merges
  # in quick succession.
  #
  # **`cancel-in-progress: false` did not close that, and `1072c3d` is the
  # proof.** It protects a run that has *started*; a run still **queued** in the
  # same group is cancelled by the next one regardless. Three merges in nine
  # minutes on 2026-09-05 produced exactly that: `ea586db` was running,
  # `1072c3d` was queued behind it in the same `refs/heads/main` group, and
  # `09f5624`'s arrival cancelled it. The run finished `cancelled` with **zero
  # jobs**, and the comment above went on claiming it could not happen. So a
  # commit on `main` had no verification of its own, which is the one thing this
  # block exists to prevent.
  #
  # The group is now the *commit* for everything except a pull request, so no
  # two `main` runs ever share one and none can cancel another — queued or
  # running. Pull requests keep grouping by ref, which is where superseding is
  # correct and where the wait it saves is paid by a person.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # **Windows only, by owner decision, 2026-09-05.** Ubuntu and macOS are
        # dropped from this matrix, and Windows now runs on every event
        # including a pull request.
        #
        # This reverses two earlier arrangements that were made on measurement,
        # so the measurements are kept rather than deleted — a later reader
        # should be able to see what the change cost:
        #
        # - **Windows was moved *off* the PR gate** because it was the whole of
        #   the wait: measured over one working session, Ubuntu verify took
        #   1m52s-2m55s and Windows 6m41s-11m54s, on every one of six PRs. It
        #   now blocks every pull request again, and that cost returns.
        # - **macOS was added by EPIC-105** to close a gap nineteen validation
        #   records carried — "no macOS host was available to validate
        #   against… claiming macOS support here without measuring it would be
        #   false." Dropping it re-opens that gap. Per Governance §17 that is a
        #   skip, not a pass: **this workflow no longer measures macOS, and no
        #   record should claim it does.** The same now applies to Linux for
        #   everything except the `storage` job below.
        #
        # What is kept is the reason Windows was never merely deleted: this
        # repository has real Windows-only history — a digest that failed only
        # there, and a CRLF regression test that failed on the one platform it
        # existed for. Windows is now the platform that gates, which is the
        # platform Ferret is developed on.
        os: ['windows-latest']
        node: ['22']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Database suites are deliberately skipped here and owned by the
      # `storage` job below, which pins a PostgreSQL service container.
      # GitHub's Windows runners cannot run Linux containers, so attempting it
      # here would be a silent skip rather than coverage — and a skip that
      # reads as a pass is the thing Governance §17 forbids.
      #
      # This is why the `storage` job stays on `ubuntu-latest` even though the
      # matrix above is Windows only: a Linux service container is the only way
      # to get a real PostgreSQL 17 + pgvector in CI, so "Windows only" applied
      # to that job would mean no database coverage at all rather than database
      # coverage on Windows.
      - name: Test (unit and integration, including packaging)
        run: npm test
        env:
          FERRET_SKIP_DOCKER_POSTGRES: '1'

      - name: Performance baseline
        run: npm run baseline
        env:
          FERRET_SKIP_DOCKER_POSTGRES: '1'

  storage:
    name: storage integration (PostgreSQL 17 + pgvector)
    runs-on: ubuntu-latest

    # The image EPIC-005 benchmarked and validated pgvector 0.8.6 against, so a
    # green run here means green against a server Ferret has actually measured.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ferret_test
          POSTGRES_PASSWORD: ferret_test_password
          POSTGRES_DB: ferret_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Migration, concurrency, crash-recovery, permission and performance
      # suites, all against the real server. EPIC-002's Definition of Done
      # requires this to pass before the Epic can be considered complete.
      - name: Storage integration, durability, reliability and performance
        run: npm test
        env:
          FERRET_TEST_DATABASE_URL: postgres://ferret_test:ferret_test_password@localhost:5432/ferret_test

      - name: Upload measured performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-performance-baseline
          path: docs/Performance/EPIC-002-storage-baseline-*.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Compatibility coverage — EPIC-114.
  #
  # **What was wrong.** `MINIMUM_POSTGRES_MAJOR = 14` is enforced at runtime in
  # `src/storage/connection.ts`, and EPIC-002's own limitation table recorded the
  # gap: *"Only PostgreSQL 17 is measured. The floor is 14 and is enforced at
  # runtime, but 14–16 are unvalidated."* Ferret refused 13 and accepted 14, 15
  # and 16 having never run against any of them — a claim in code with no
  # measurement behind it, which is the shape Governance §17 exists to prevent.
  #
  # **Why this is scheduled rather than on the PR gate.** The owner decision of
  # 2026-09-05 asks for the normal pull-request path to stay as light as
  # reasonably possible, with PostgreSQL 17 as the primary target. A break at the
  # floor is real but rare, and it is almost never caused by the commit that
  # reveals it: nothing in Ferret uses version-specific syntax, so what this lane
  # catches is a dependency or an image changing under it. Nightly finds that
  # within a day and costs no author any wait at all.
  #
  # **Isolated, and visible.** Its own job, its own name per version, and
  # `fail-fast: false` so one broken major does not hide the others. It never
  # runs on a pull request, so it can neither slow one down nor be mistaken for
  # a gate — and when it fails, it fails on `main` where the failure is a
  # notification rather than a review comment.
  #
  # **14 is the floor and 15 and 16 are the middle of the range.** All three are
  # here because a floor that works while the middle does not is not a supported
  # range, and the marginal cost of two more parallel containers on a nightly
  # run is close to nothing.
  #
  # **No record may claim a version this has not measured.** The lane existing
  # is not coverage; a green run is. `docs/EPICs/validation/EPIC-114-VALIDATION.md`
  # records which versions have actually run and when.
  compatibility:
    name: compatibility (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    # Scheduled and on demand only. `workflow_dispatch` is how a change to this
    # lane is measured before it is merged, rather than merged and hoped for.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        # The declared floor first, then the middle of the range. 17 is not here
        # because `storage` above measures it on every pull request, and
        # measuring it twice would spend a runner to learn nothing.
        postgres: ['14', '15', '16']

    services:
      postgres:
        image: pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          POSTGRES_USER: ferret_test
          POSTGRES_PASSWORD: ferret_test_password
          POSTGRES_DB: ferret_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The version actually reached, printed before anything asserts against
      # it. A service image whose tag no longer means what it did would
      # otherwise produce a green run for the wrong major — the failure mode
      # that makes a compatibility lane worse than none.
      - name: Report the server version under test
        run: |
          node -e "const {Client}=require('pg');const c=new Client(process.env.FERRET_TEST_DATABASE_URL);c.connect().then(()=>c.query('SHOW server_version')).then(r=>{console.log('server_version',r.rows[0].server_version);return c.end();}).catch(e=>{console.error(e.message);process.exit(1);});"
        env:
          FERRET_TEST_DATABASE_URL: postgres://ferret_test:ferret_test_password@localhost:5432/ferret_test

      # The same suite the `storage` job runs against 17. Deliberately the same:
      # a compatibility lane that ran a reduced subset would measure something
      # other than what the PR gate measures, and the difference is exactly where
      # a version-specific break would hide.
      - name: Storage integration, durability, reliability and performance
        run: npm test
        env:
          FERRET_TEST_DATABASE_URL: postgres://ferret_test:ferret_test_password@localhost:5432/ferret_test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # High and critical advisories fail the build. Moderate findings are
      # reported but do not block, matching the posture recorded in
      # docs/TECHNOLOGY-DECISIONS.md section 10.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
